<div class="ruler" aria-hidden="true">
  <b>0</b>
  <span>cm</span>
</div>

<div class="desk">
  <header class="desk-head">
    <a class="brand" routerLink="/">
      {{ profile.name.toLowerCase() }}
      <small>{{ i18n.t('desk.role') }}</small>
    </a>

    <div class="lang" role="group" [attr.aria-label]="i18n.t('desk.lang')">
      @for (lang of langs; track lang) {
        <button
          type="button"
          [attr.aria-pressed]="i18n.lang() === lang"
          (click)="i18n.lang.set(lang)">
          {{ lang.toUpperCase() }}
        </button>
      }
    </div>
  </header>

  <app-folder-tabs [active]="active()" />

  <div class="folder-stack">
    <div class="folder-back folder-back--2" [style.background]="colors().back2" aria-hidden="true"></div>
    <div class="folder-back folder-back--1" [style.background]="colors().back1" aria-hidden="true"></div>

    <main class="folder" [style.background]="colors().front">
      <p class="folder-label">{{ label() }}</p>
      <router-outlet />
    </main>
  </div>

  <footer class="desk-foot">
    <span>{{ year }} · {{ profile.name.toLowerCase() }}</span>
    <span class="desk-foot-links">
      <a [href]="profile.github" target="_blank" rel="noreferrer">github</a>
      <a [href]="profile.linkedin" target="_blank" rel="noreferrer">linkedin</a>
    </span>
  </footer>
</div>
